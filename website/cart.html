<!DOCTYPE html>
<html>
<head>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <title>Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="asteroids">
  <span style="left:10%; animation-duration:25s;"></span>
  <span style="left:25%; animation-duration:30s;"></span>
  <span style="left:40%; animation-duration:35s;"></span>
  <span style="left:60%; animation-duration:28s;"></span>
  <span style="left:75%; animation-duration:32s;"></span>
  <span style="left:90%; animation-duration:40s;"></span>
</div>
<nav>
  <a href="index.html" class="logo">Delay Services</a>
  <a href="index.html" class="back-btn">← Back</a>
</nav>
<section class="center-box">
  <div class="auth-box" style="width: 400px;">
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <h3 id="total"></h3>
    <button class="checkout-btn" onclick="checkout()">Checkout</button>
  </div>
</section>
<script>
// 🔐 PROTECTION
if (!localStorage.getItem("currentUser")) {
  window.location.href = "login.html";
}
const cart = JSON.parse(localStorage.getItem("cart")) || [];
const container = document.getElementById("cartItems");
let total = 0;
cart.forEach((item, index) => {
  const div = document.createElement("div");
  div.innerHTML = `
    <strong>${item.name}</strong> - $${item.price}
    <button onclick="removeItem(${index})">❌</button>
  `;
  container.appendChild(div);
  total += item.price;
});
document.getElementById("total").innerText = "Total: $" + total.toFixed(2);
function removeItem(index) {
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  location.reload();
}
function checkout() {
  window.open("https://discord.gg/delayservices", "_blank");
}
</script>
<script src="script.js"></script>
</body>
</html>
