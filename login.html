<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="asteroids">
  <span style="left:10%; animation-duration:25s;"></span>
  <span style="left:25%; animation-duration:30s;"></span>
  <span style="left:40%; animation-duration:35s;"></span>
  <span style="left:60%; animation-duration:28s;"></span>
  <span style="left:75%; animation-duration:32s;"></span>
  <span style="left:90%; animation-duration:40s;"></span>
</div>

<nav>
  <a href="index.html" class="logo">Delay Services</a>
  <a href="index.html" class="back-btn">← Back</a>
</nav>

<section class="center-box">
  <div class="auth-box">
    <h2 id="title">Login</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button class="auth-btn" onclick="handleAuth()">Login</button>

    <p class="switch" id="switchText">
      Don't have an account?
      <span class="link" onclick="toggleMode()">Sign up</span>
    </p>
  </div>
</section>

<!-- ✅ LOAD SCRIPT LAST (VERY IMPORTANT) -->
<script src="auth.js"></script>

</body>
</html>
